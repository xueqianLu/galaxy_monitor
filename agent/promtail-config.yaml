# ============================================================
# Promtail 配置文件
# ============================================================
# 说明：
#   - 采集 /var/lib/docker/containers 下的容器日志
#   - 将日志推送到管理端 Loki
#   - 请将 <MANAGER_TAILSCALE_IP> 替换为管理端的 Tailscale IP 地址
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# ============================================================
# Loki 推送地址
# ============================================================
# 请将 <MANAGER_TAILSCALE_IP> 替换为管理端的实际 Tailscale IP 地址
clients:
  - url: http://<MANAGER_TAILSCALE_IP>:3100/loki/api/v1/push

scrape_configs:
  # ----------------------------------------------------------
  # Docker 容器日志采集
  # ----------------------------------------------------------
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*.log

    pipeline_stages:
      # Docker 日志格式为 JSON，解析其中的 log、stream、time 字段
      - docker: {}

      # 提取容器名称标签（从日志文件路径中提取容器 ID）
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.+\.log'

      - labels:
          container_id:
