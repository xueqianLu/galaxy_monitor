# ============================================================
# Grafana 数据源自动配置
# ============================================================
# 说明：
#   - Prometheus 用于查询系统指标和容器指标
#   - Loki 用于查询容器日志
# ============================================================

apiVersion: 1

datasources:
  # Prometheus 数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Loki 数据源
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
