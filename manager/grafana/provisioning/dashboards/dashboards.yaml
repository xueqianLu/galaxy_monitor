# ============================================================
# Grafana 仪表盘自动配置
# ============================================================
# 说明：
#   - 自动加载 /var/lib/grafana/dashboards 目录下的仪表盘 JSON 文件
#   - 可将自定义仪表盘 JSON 放入该目录实现自动导入
# ============================================================

apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
